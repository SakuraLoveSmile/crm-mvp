<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM MVP · 客户-商机-合同-回款</title>
<meta name="description" content="飞书多维表格 CRM 方案的可运行 MVP：客户、商机、合同、回款与仪表盘，纯静态、零依赖。">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F3864'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">C</span>
    <div>
      <div class="brand-name">CRM MVP</div>
      <div class="brand-sub">客户 · 商机 · 合同 · 回款</div>
    </div>
  </div>
  <div class="top-actions">
    <label class="role-picker">
      <span>切换角色</span>
      <select id="roleSelect"></select>
    </label>
    <button class="btn ghost" id="btnExport" title="导出合同台账 CSV">导出</button>
    <button class="btn ghost" id="btnReset" title="恢复演示数据">重置</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="nav"></nav>
  <main class="main">
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script src="assets/app.js" defer></script>
</body>
</html>
